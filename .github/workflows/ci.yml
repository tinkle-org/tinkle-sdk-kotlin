name: Kotlin SDK CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Bootstrap only: libtinkle branch/tag/SHA containing native automation; empty uses sdk-artifact.json'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: kotlin-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Verify build logic is present in a fresh checkout
        run: |
          test -f buildSrc/src/main/groovy/com/tinkle/build/PrepareSdkArtifacts.groovy
          test -f buildSrc/src/main/groovy/com/tinkle/build/SdkArtifacts.groovy
          test -f buildSrc/src/test/groovy/com/tinkle/build/PrepareSdkArtifactsTest.groovy
          test -f buildSrc/src/test/groovy/com/tinkle/build/SdkArtifactsTest.groovy
      - name: Test build logic without native release artifacts
        run: ./gradlew --no-daemon -p buildSrc test
      - name: Test SDK Python checks
        run: python3 -B -m unittest discover -s tests -v
  source:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      core_sha: ${{ steps.source.outputs.core_sha }}
      bootstrap: ${{ steps.source.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: source
        name: Select published provenance or explicit bootstrap source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, urllib.parse
          metadata = pathlib.Path('sdk-artifact.json')
          ref = os.environ.get('SOURCE_REF', '')
          if metadata.exists():
              assert not ref, 'Published SDK CI must use its manifest SHA'
              ref = json.loads(metadata.read_text())['source_revision']
              assert re.fullmatch('[0-9a-f]{40}', ref), 'Expected exact source revision'
              bootstrap = False
          else:
              bootstrap = bool(ref)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + str(bool(ref)).lower() + '\n')
              output.write('bootstrap=' + str(bootstrap).lower() + '\n')
              if ref:
                  data = json.loads(subprocess.check_output(['gh', 'api', 'repos/tinklehq/libtinkle/commits/' + urllib.parse.quote(ref, safe='')]))
                  assert re.fullmatch('[0-9a-f]{40}', data['sha'])
                  output.write('core_sha=' + data['sha'] + '\n')
              else:
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('Native consumer validation is **not run**: awaiting the first core release. Run workflow_dispatch with explicit source_ref for bootstrap proof. No release metadata or SDK tag is fabricated.\n')
          PY
  consumer:
    needs: source
    if: needs.source.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            target: default
            pages: 4096
          - api: 36
            target: google_apis
            pages: 4096
          - api: 36
            target: google_apis_ps16k
            pages: 16384
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      BOOTSTRAP: ${{ needs.source.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tinklehq/libtinkle
          ref: ${{ needs.source.outputs.core_sha }}
          path: core
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Bootstrap native artifact (test only)
        if: env.BOOTSTRAP == 'true'
        working-directory: core
        env:
          SDK_OUTPUT_DIR: ${{ github.workspace }}/artifacts
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android --target armv7-linux-androideabi --target i686-linux-android --target x86_64-linux-android
          python3 scripts/sdk-ci.py toolchain
          python3 scripts/sdk-ci.py android-setup
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          bash scripts/build-android.sh
      - name: Prepare native inspection tools
        if: env.BOOTSTRAP != 'true'
        run: python3 core/scripts/sdk-ci.py android-setup
      - name: Verify checksums and generated binding parity
        run: |
          if [[ "$BOOTSTRAP" == true ]]; then
            python3 core/scripts/sdk-ci.py stage --sdk kotlin --destination sdk --artifacts artifacts --bootstrap
          else
            python3 core/scripts/sdk-ci.py stage --sdk kotlin --destination sdk --artifacts artifacts --download
          fi
      - run: python3 core/scripts/sdk-ci.py android-build --destination sdk --artifacts artifacts
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: python3 core/scripts/sdk-ci.py android-test --destination sdk --artifacts artifacts --api-level ${{ matrix.api }} --page-size ${{ matrix.pages }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-consumer-${{ matrix.api }}-${{ matrix.pages }}
          path: |
            sdk/build/outputs/aar/*-release.aar
            sdk/build/sdk-ci-aar.json
            sdk/sample/build/reports/androidTests
          retention-days: 14
